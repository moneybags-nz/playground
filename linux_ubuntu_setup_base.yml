---
- name: Setup and configure Ubuntu Server base
  hosts: newinstalls
  become: true
  vars_files:
    - vars/external_vars.yml
  tasks:

    - name: Restart Services Automatically after install
      ansible.builtin.lineinfile:
        path: /etc/needrestart/needrestart.conf
        regexp: '^\#\s*\$nrconf\{restart\}\s*=\s*''i'';'  # modifies needrestart.conf to automatically restart
        line: "$nrconf{restart} = 'a'; # restart the services automatically"

    - name: Update apt cache and packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: yes

    - name: Extend logical volume
      community.general.lvol:
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: +100%FREE
        resizefs: true

    - name: Set timezone to Pacific/Auckland
      community.general.timezone:
        name: Pacific/Auckland

    - name: Install qemu agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Install net-tools
      ansible.builtin.apt:
        name: net-tools
        state: present

