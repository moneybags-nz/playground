    - name: Install Key # Copies SSH key to remote server
      ansible.posix.authorized_key:
        user: master
        state: present
        key: "{{ lookup('file', '/home/moneybags/.ssh/isalei_servers.pub') }}"

    - name: Disable password-based auth
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#\s*PasswordAuthentication\s+yes'
        line: 'PasswordAuthentication no'

    - name: Disable challenge response authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_config
        line: 'ChallengeResponseAuthentication no'

    - name: Restart SSH service
      ansible.builtin.service:
        name: ssh
        state: restarted
    
    - name: Download neofetch to /usr/local/bin
      ansible.builtin.get_url:
        url: "https://github.com/dylanaraps/neofetch/neofetch"
        dest: "/usr/local/bin/neofetch"
        mode: "0755"

    - name: Change file ownership, group and permissions of neofetch
      ansible.builtin.file:
        path: /usr/local/bin/neofetch
        mode: '+x'

    - name: Create or update /etc/profile.d/motd.sh to run neofetch
      ansible.builtin.blockinfile:
        path: /etc/profile.d/motd.sh
        block: |
          printf "\n"
          neofetch
        create: true

    - name: Change file ownership, group and permissions for motd.sh
      ansible.builtin.file:
        path: /etc/profile.d/motd.sh
        owner: root
        group: root
        mode: 'u+x'

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 30
